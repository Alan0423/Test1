<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monthly Money Checkup — Financial Problem Analyzer</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel-2: #1d2639;
    --line: #2a3550;
    --text: #e8edf7;
    --muted: #93a0bd;
    --accent: #5b8cff;
    --good: #2ecc8f;
    --warn: #f5b942;
    --bad: #ff6b6b;
    --radius: 14px;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2743 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    max-width: 1060px;
    margin: 0 auto;
    padding: 36px 20px 10px;
  }
  h1 { margin: 0 0 6px; font-size: 1.9rem; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0; }
  main { max-width: 1060px; margin: 0 auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 22px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
  input, select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 1rem;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: end; }
  .row > div { flex: 1; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }
  button.small { padding: 6px 10px; font-size: 0.8rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.94rem; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .8px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 2px 6px; }
  .del:hover { color: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 22px; }
  @media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .stat .k { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; }
  .stat .v { font-size: 1.9rem; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat .d { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .bar-row { margin-bottom: 12px; }
  .bar-head { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 5px; }
  .bar-head .amt { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar-track { height: 10px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width .4s ease; }
  .empty { color: var(--muted); font-size: .92rem; padding: 14px 0; }
  .footnote { color: var(--muted); font-size: .78rem; margin-top: 10px; }
  .section-gap { margin-top: 20px; }
  td.date, th.date { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 820px) { .report-grid { grid-template-columns: 1fr; } }
  .report-block h3 {
    margin: 0 0 8px; font-size: .92rem; font-weight: 600;
    letter-spacing: .4px; color: var(--text);
  }
  .report-table { font-size: .88rem; }
  .report-table th { font-size: .72rem; }
  .report-table td { padding: 7px 8px; }
  .report-table tr.total td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: none; }
  .table-scroll { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .table-scroll .report-table { margin: 0; }
  .table-scroll thead th {
    position: sticky; top: 0; background: var(--panel-2); z-index: 1;
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
  .toolbar .spacer { flex: 1; }
  @media print {
    body { background: #fff; color: #111; padding: 0; }
    .card, .stat { background: #fff; border-color: #ccc; }
    .card h2, .stat .k, .stat .d, .sub, .footnote, td.date, .report-block h3 { color: #444; }
    input, select { background: #fff; color: #111; border-color: #ccc; }
    .toolbar, #clearBtn, #downloadCsvBtn, #sampleBtn, #addBtn, .del { display: none !important; }
    .table-scroll { max-height: none; overflow: visible; border: none; }
    .grid { grid-template-columns: 1fr; }
    .report-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Monthly Money Checkup</h1>
</header>

<main>
  <div class="grid">
    <!-- INPUT -->
    <section class="card">
      <h2>1 ·monthly use</h2>
      <div class="row">
        <div style="display:none">
          <label for="month">Month</label>
          <input type="month" id="month" />
        </div>
        <div>
          <label for="income">Total income (₹)</label>
          <input type="number" id="income" min="0" step="0.01" placeholder="e.g. 75000" />
        </div>
      </div>

      <div class="row" style="margin-top:12px">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" />
        </div>
        <div>
          <label for="cat">Expense category</label>
          <select id="cat">
            <option>Dining out</option>
            <option>Utilities</option>
            <option>Groceries</option>
            <option>Transport</option>
            <option>Debt payments</option>
            <option>Rent / Mortgage</option>
            <option>Subscriptions</option>
            <option>Healthcare</option>
            <option>Entertainment</option>
            <option>Savings</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:12px">
        <div>
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" min="0" step="0.01" placeholder="e.g. 1200" />
        </div>
        <div style="flex:0 0 auto">
          <button id="addBtn">Add daily expense</button>
        </div>
      </div>

      <div style="margin-top:18px; overflow-x:auto">
        <table>
          <thead>
            <tr><th class="date">Date</th><th>Category</th><th class="num">Amount</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="emptyMsg">No expenses added yet.</div>
      </div>

      <div class="row section-gap" style="flex-wrap:wrap">
        <button class="ghost" id="clearBtn">Clear month</button>
        <button id="downloadCsvBtn" type="button">Download CSV</button>
      </div>
    </section>

    <!-- RESULTS -->
    <section class="card">
      <h2>2 · Analysis</h2>

      <div class="stats" style="margin-top:0">
        <div class="stat">
          <div class="k">Net balance</div>
          <div class="v" id="net">₹0</div>
          <div class="d" id="netNote">Add income to begin</div>
        </div>
        <div class="stat">
          <div class="k">Spent</div>
          <div class="v" id="spent">₹0</div>
          <div class="d" id="spentPct">0% of income</div>
        </div>
      </div>

      <div class="section-gap">
        <h2>money use</h2>
        <div id="bars"><div class="empty">Your expense breakdown will appear here.</div></div>
      </div>
    </section>
  </div>

</main>

<script>
(function () {
  "use strict";

  // ---- state ----
  var state = load();

  // ---- date helpers ----
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function localMonth() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  }
  function localDay() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function daysInMonth(key) {
    var y = +key.slice(0, 4), mo = +key.slice(5, 7);
    return new Date(y, mo, 0).getDate();
  }
  function monthKey() {
    var el = document.getElementById("month");
    return el.value || localMonth();
  }
  // Sensible default entry date for the selected month.
  function defaultDate() {
    var key = monthKey();
    if (key === localMonth()) return localDay();
    var now = new Date();
    var firstOfMonth = new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1);
    if (now < firstOfMonth) return key + "-01";           // future month: first day
    return key + "-" + pad2(daysInMonth(key));            // past month: last day
  }
  function dayName(iso) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return "";
    return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()];
  }
  function prettyDate(iso) {
    return dayName(iso) + " " + iso.slice(5, 7) + "/" + iso.slice(8, 10);
  }

  function load() {
    try {
      var parsed = JSON.parse(localStorage.getItem("mmc-state"));
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
      Object.keys(parsed).forEach(function (key) {
        if (!/^\\d{4}-\\d{2}$/.test(key) || !parsed[key] || typeof parsed[key] !== "object") {
          delete parsed[key];
          return;
        }
        parsed[key].income = Number(parsed[key].income) || 0;
        if (!Array.isArray(parsed[key].expenses)) parsed[key].expenses = [];
        parsed[key].expenses = parsed[key].expenses.filter(function (e) {
          return e && typeof e === "object" && Number.isFinite(Number(e.amt)) && Number(e.amt) >= 0;
        }).map(function (e) {
          return { date: typeof e.date === "string" ? e.date : "", cat: String(e.cat || "Other"), amt: Number(e.amt) || 0 };
        });
      });
      return parsed;
    } catch (e) {
      console.error("Could not load saved data:", e);
      return {};
    }
  }
  function save() {
    try {
      localStorage.setItem("mmc-state", JSON.stringify(state));
      return true;
    } catch (e) {
      console.error("Could not save data to browser storage:", e);
      return false;
    }
  }
  function current() {
    var k = monthKey();
    if (!state[k]) state[k] = { income: 0, expenses: [] };
    // migrate entries saved before daily tracking existed
    state[k].expenses.forEach(function (e) {
      if (typeof e.date !== "string") e.date = "";
    });
    return state[k];
  }

  // ---- money helpers ----
  function money(n) {
    var sign = n < 0 ? "-" : "";
    return sign + "₹" + Math.abs(n).toLocaleString("en-IN", {
      minimumFractionDigits: 0, maximumFractionDigits: 2
    });
  }
  function pct(part, whole) {
    if (!whole) return 0;
    return (part / whole) * 100;
  }

  // ---- rendering ----
  var $ = function (id) { return document.getElementById(id); };

  function render() {
    var m = current();
    

    // table
    var tbody = $("rows");
    tbody.innerHTML = "";
    m.expenses.forEach(function (e, i) {
      var tr = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.className = "date";
      td0.textContent = e.date ? prettyDate(e.date) : "no date";
      var td1 = document.createElement("td");
      td1.textContent = e.cat;
      var td2 = document.createElement("td");
      td2.className = "num";
      td2.textContent = money(e.amt);
      var td3 = document.createElement("td");
      td3.style.textAlign = "right";
      var btn = document.createElement("button");
      btn.className = "del";
      btn.textContent = "×";
      btn.title = "Remove";
      btn.onclick = function () { m.expenses.splice(i, 1); save(); render(); };
      td3.appendChild(btn);
      tr.appendChild(td0); tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      tbody.appendChild(tr);
    });
    $("emptyMsg").style.display = m.expenses.length ? "none" : "block";

    $("income").value = m.income || "";

    analyze(m);
  }

  var lastReport = null;

  function analyze(m) {
    var income = Number(m.income) || 0;
    var spent = m.expenses.reduce(function (s, e) { return s + e.amt; }, 0);
    var net = income - spent;
    var spct = pct(spent, income);
    var dim = daysInMonth(monthKey());
    var elapsed = monthKey() === localMonth() ? new Date().getDate() : dim;
    var recDays = countDays(m.expenses);
    var undated = m.expenses.length - m.expenses.filter(function (e) { return !!e.date; }).length;
    var avgDay = recDays ? spent / recDays : 0;
    var safeDay = income ? income / dim : 0;
    var projected = recDays ? avgDay * elapsed : 0;

    // headline numbers
    var netEl = $("net");
    netEl.textContent = money(net);
    netEl.className = "v " + (net > 0 ? "good" : net < 0 ? "bad" : "");
    $("netNote").textContent = !income ? "Add income to begin"
      : net >= 0 ? "Leftover this month" : "You spent more than you earned";
    $("spent").textContent = money(spent);
    $("spentPct").textContent = income ? spct.toFixed(1) + "% of income" : "no income set";

    // bars
    var byCat = catTotals(m.expenses);
    var sorted = m.expenses.slice().sort(function (a, b) { return b.amt - a.amt; });
    var bars = $("bars");
    bars.innerHTML = "";
    if (!m.expenses.length) {
      bars.innerHTML = '<div class="empty">Your expense breakdown will appear here.</div>';
    } else {
      var colors = ["#5b8cff", "#2ecc8f", "#f5b942", "#ff6b6b", "#a77bff", "#4dd0e1", "#ff8fab", "#9ccc65"];
      sorted.forEach(function (e, i) {
        var share = pct(e.amt, income || spent);
        var row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML =
          '<div class="bar-head"><span>' + esc(e.cat) + '</span>' +
          '<span class="amt">' + money(e.amt) + (income ? " · " + share.toFixed(1) + "%" : "") + '</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:0%;background:' +
          colors[i % colors.length] + '"></div></div>';
        bars.appendChild(row);
        var fill = row.querySelector(".bar-fill");
        var denom = Math.max(income, spent) || 1;
        requestAnimationFrame(function () {
          fill.style.width = Math.min(100, (e.amt / denom) * 100) + "%";
        });
      });
    }

    // ---- generated report tables ----
    lastReport = {
      key: monthKey(), income: income, spent: spent, net: net, spct: spct,
      dim: dim, elapsed: elapsed, recDays: recDays, avgDay: avgDay,
      projected: projected, undated: undated, expenses: m.expenses, byCat: byCat
    };
    renderReport(lastReport);
  }

  function catTotals(list) {
    var t = {};
    list.forEach(function (e) { t[e.cat] = (t[e.cat] || 0) + e.amt; });
    return t;
  }

  // Generic table builder: headers = [{text, num}], rows = [{cells:[{v,num}], total}]
  function makeTable(mount, headers, rows) {
    mount.innerHTML = "";
    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    headers.forEach(function (h) {
      var th = document.createElement("th");
      th.textContent = h.text;
      if (h.num) th.className = "num";
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    mount.appendChild(thead);

    var tbody = document.createElement("tbody");
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      if (r.total) tr.className = "total";
      r.cells.forEach(function (c) {
        var td = document.createElement("td");
        td.textContent = c.v;
        if (c.num) td.className = "num";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    mount.appendChild(tbody);
  }

  function renderReport(r) {
    // Report section was removed from the UI; keep the rest of the app functional.
    if (!$("repSummary")) return;
    $("repMonth").textContent = r.key;

    // summary
    makeTable($("repSummary"), [{ text: "Item" }, { text: "Value", num: true }], [
      { cells: [{ v: "Total income" }, { v: money(r.income), num: true }] },
      { cells: [{ v: "Total expenses" }, { v: money(r.spent), num: true }] },
      { cells: [{ v: "Net balance" }, { v: money(r.net), num: true }] },
      { cells: [{ v: "Spent (% of income)" }, { v: r.income ? r.spct.toFixed(1) + "%" : "—", num: true }] },
      { cells: [{ v: "Days with expenses" }, { v: r.recDays + " of " + r.dim, num: true }] },
      { cells: [{ v: "Average per active day" }, { v: money(r.avgDay), num: true }] },
      { cells: [{ v: "Projected month total" }, { v: money(r.projected), num: true }] },
      { cells: [{ v: "Entries without a date" }, { v: String(r.undated), num: true }] }
    ]);

    // category breakdown
    var cats = Object.keys(r.byCat).sort(function (a, b) { return r.byCat[b] - r.byCat[a]; });
    var catRows;
    if (!cats.length) {
      catRows = [{ cells: [{ v: "No expenses yet" }, { v: "—", num: true }, { v: "—", num: true }] }];
    } else {
      catRows = cats.map(function (c) {
        return { cells: [
          { v: c },
          { v: money(r.byCat[c]), num: true },
          { v: r.income ? pct(r.byCat[c], r.income).toFixed(1) + "%" : "—", num: true }
        ] };
      });
      catRows.push({ total: true, cells: [
        { v: "Total" }, { v: money(r.spent), num: true },
        { v: r.income ? r.spct.toFixed(1) + "% of income" : "—", num: true }
      ] });
    }
    makeTable($("repCats"), [{ text: "Category" }, { text: "Amount", num: true }, { text: "% of income", num: true }], catRows);

    // daily breakdown
    var dayTotals = {};
    r.expenses.forEach(function (e) {
      if (!e.date) return;
      dayTotals[e.date] = (dayTotals[e.date] || 0) + e.amt;
    });
    var dayKeys = Object.keys(dayTotals).sort();
    var running = 0;
    var dayRows = dayKeys.map(function (k) {
      running += dayTotals[k];
      var count = r.expenses.filter(function (e) { return e.date === k; }).length;
      return { cells: [
        { v: k },
        { v: dayName(k) },
        { v: money(dayTotals[k]), num: true },
        { v: money(running), num: true },
        { v: String(count), num: true }
      ] };
    });
    makeTable($("repDays"),
      [{ text: "Date" }, { text: "Day" }, { text: "Day total", num: true }, { text: "Running total", num: true }, { text: "Entries", num: true }],
      dayRows.length ? dayRows : [{ cells: [{ v: "No dated entries yet" }, { v: "—" }, { v: "—", num: true }, { v: "—", num: true }, { v: "—", num: true }] }]);

    // all entries
    var entryRows = r.expenses.slice()
      .sort(function (a, b) { return (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0; })
      .map(function (e) {
        return { cells: [{ v: e.date || "(no date)" }, { v: e.cat }, { v: money(e.amt), num: true }] };
      });
    makeTable($("repEntries"), [{ text: "Date" }, { text: "Category" }, { text: "Amount", num: true }],
      entryRows.length ? entryRows : [{ cells: [{ v: "No entries yet" }, { v: "—" }, { v: "—", num: true }] }]);
  }

  // ---- report download ----
  function csvCell(v) {
    if (v === null || v === undefined) v = "";
    v = String(v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function round2(n) { return Math.round(n * 100) / 100; }

  function buildCsv() {
    var r = lastReport;
    if (!r) return "";
    var rows = [];

    rows.push(["Monthly Money Checkup — report sheet"]);
    rows.push(["Currency", "INR (₹)"]);
    rows.push([]);

    rows.push(["MONTHLY SUMMARY"]);
    rows.push(["Total income", round2(r.income)]);
    rows.push(["Total expenses", round2(r.spent)]);
    rows.push(["Net balance", round2(r.net)]);
    rows.push(["Spent (% of income)", r.income ? round2(r.spct) : ""]);
    rows.push(["Days with expenses", r.recDays + " of " + r.dim]);
    rows.push(["Average per active day", round2(r.avgDay)]);
    rows.push(["Projected month total", round2(r.projected)]);
    rows.push(["Entries without a date", r.undated]);
    rows.push([]);

    rows.push(["CATEGORY BREAKDOWN"]);
    rows.push(["Category", "Amount", "% of income"]);
    Object.keys(r.byCat).sort(function (a, b) { return r.byCat[b] - r.byCat[a]; }).forEach(function (c) {
      rows.push([c, round2(r.byCat[c]), r.income ? round2(pct(r.byCat[c], r.income)) : ""]);
    });
    rows.push(["Total", round2(r.spent), r.income ? round2(r.spct) : ""]);
    rows.push([]);

    rows.push(["DAILY BREAKDOWN"]);
    rows.push(["Date", "Day", "Day total", "Running total", "Entries"]);
    var dayTotals = {};
    r.expenses.forEach(function (e) { if (e.date) dayTotals[e.date] = (dayTotals[e.date] || 0) + e.amt; });
    var running = 0;
    Object.keys(dayTotals).sort().forEach(function (k) {
      running += dayTotals[k];
      var count = r.expenses.filter(function (e) { return e.date === k; }).length;
      rows.push([k, dayName(k), round2(dayTotals[k]), round2(running), count]);
    });
    rows.push([]);

    rows.push(["ALL EXPENSE ENTRIES"]);
    rows.push(["Date", "Category", "Amount"]);
    r.expenses.slice()
      .sort(function (a, b) { return (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0; })
      .forEach(function (e) { rows.push([e.date || "(no date)", e.cat, round2(e.amt)]); });

    return "\ufeff" + rows.map(function (row) {
      return row.map(csvCell).join(",");
    }).join("\r\n");
  }

  function download(filename, text) {
    var blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  // Full-history backup and restore, without changing the visible interface.
  // Ctrl+Shift+E (Cmd+Shift+E on Mac): export all months to CSV.
  // Ctrl+Shift+I (Cmd+Shift+I on Mac): import a full-history CSV backup.
  function buildAllDataCsv() {
    var rows = [
      ["Monthly Money Checkup — complete data backup"],
      ["Generated", new Date().toLocaleString()],
      [],
      ["MONTHLY INCOME"],
      ["Month", "Income (INR)"]
    ];
    Object.keys(state).sort().forEach(function (key) {
      var m = state[key] || {};
      rows.push([key, round2(Number(m.income) || 0)]);
    });
    rows.push([], ["ALL EXPENSE ENTRIES"], ["Month", "Date", "Category", "Amount (INR)"]);
    Object.keys(state).sort().forEach(function (key) {
      var m = state[key] || {};
      (Array.isArray(m.expenses) ? m.expenses : []).forEach(function (e) {
        rows.push([key, e.date || "", e.cat || "Other", round2(Number(e.amt) || 0)]);
      });
    });
    return "\ufeff" + rows.map(function (row) {
      return row.map(csvCell).join(",");
    }).join("\r\n");
  }

  function parseBackupCsv(text) {
    text = String(text || "").replace(/^\uFEFF/, "");
    var rows = [], row = [], value = "", quoted = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === '"') {
        if (quoted && text[i + 1] === '"') { value += '"'; i++; }
        else quoted = !quoted;
      } else if (ch === "," && !quoted) {
        row.push(value); value = "";
      } else if ((ch === "\n" || ch === "\r") && !quoted) {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(value);
        if (row.some(function (v) { return v !== ""; })) rows.push(row);
        row = []; value = "";
      } else value += ch;
    }
    row.push(value);
    if (row.some(function (v) { return v !== ""; })) rows.push(row);
    return rows;
  }

  function importAllDataCsv(text) {
    var rows = parseBackupCsv(text), incomeHeader = -1, expenseHeader = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][0] === "Month" && rows[i][1] === "Income (INR)") incomeHeader = i;
      if (rows[i][0] === "Month" && rows[i][1] === "Date" &&
          rows[i][2] === "Category" && rows[i][3] === "Amount (INR)") expenseHeader = i;
    }
    if (incomeHeader < 0 || expenseHeader < 0 || expenseHeader <= incomeHeader) {
      throw new Error("Unsupported CSV. Import a full-history backup exported by this app.");
    }

    var imported = {};
    for (var a = incomeHeader + 1; a < expenseHeader; a++) {
      var ir = rows[a], month = ir[0] || "";
      if (!/^\d{4}-\d{2}$/.test(month)) continue;
      imported[month] = { income: Math.max(0, Number(ir[1]) || 0), expenses: [] };
    }
    for (var b = expenseHeader + 1; b < rows.length; b++) {
      var er = rows[b], key = er[0] || "";
      if (!/^\d{4}-\d{2}$/.test(key)) continue;
      var date = er[1] || "", category = er[2] || "Other", amount = Number(er[3]);
      if (!imported[key]) imported[key] = { income: 0, expenses: [] };
      if (!Number.isFinite(amount) || amount < 0) continue;
      if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) date = "";
      if (date && date.slice(0, 7) !== key) continue;
      imported[key].expenses.push({ date: date, cat: category, amt: amount });
    }

    var keys = Object.keys(imported);
    if (!keys.length) throw new Error("No valid monthly records found in this backup.");
    if (!confirm("Import " + keys.length + " month(s)? Existing records for these months will be replaced. Export a backup of current data first.")) return;

    keys.forEach(function (key) { state[key] = imported[key]; });
    if (!save()) {
      alert("Import could not be saved to browser storage. Keep the CSV file as your backup.");
      return;
    }
    $("month").value = keys.sort().slice(-1)[0];
    $("date").value = defaultDate();
    render();
    alert("Backup restored successfully.");
  }

  function exportAllDataCsv() {
    download("money-checkup-all-data-" + localDay() + ".csv", buildAllDataCsv());
  }

  var backupPicker = document.createElement("input");
  backupPicker.type = "file";
  backupPicker.accept = ".csv,text/csv";
  backupPicker.hidden = true;
  backupPicker.addEventListener("change", function () {
    var file = backupPicker.files && backupPicker.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { importAllDataCsv(reader.result); }
      catch (e) { console.error(e); alert(e.message || "Could not import this backup CSV."); }
      finally { backupPicker.value = ""; }
    };
    reader.onerror = function () {
      alert("Could not read the selected backup file.");
      backupPicker.value = "";
    };
    reader.readAsText(file);
  });
  document.body.appendChild(backupPicker);

  document.addEventListener("keydown", function (event) {
    if (!(event.ctrlKey || event.metaKey) || !event.shiftKey || event.altKey) return;
    var key = String(event.key || "").toLowerCase();
    if (key === "e") {
      event.preventDefault();
      exportAllDataCsv();
    } else if (key === "i") {
      event.preventDefault();
      backupPicker.click();
    }
  });

  // Persist on page hide as a final safeguard; main form handlers save immediately.
  window.addEventListener("pagehide", function () { save(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") save();
  });

  function countDays(list) {
    var seen = {};
    list.forEach(function (e) { if (e.date) seen[e.date] = true; });
    return Object.keys(seen).length;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // Automatic cloud sync: load the shared sheet on startup and upload after changes.
  var cloudSyncReady = false;
  var cloudSyncQueue = Promise.resolve();
  function autoSyncToCloud() {
    var snapshot = JSON.parse(JSON.stringify(state));
    cloudSyncQueue = cloudSyncQueue.then(function () {
      return postCloudState(snapshot);
    }).then(function () {
      console.info("Google Sheets sync request sent.");
    }).catch(function (err) {
      console.error("Automatic Google Sheets sync failed:", err);
      // Do not block expense entry if the network or endpoint is unavailable.
    });
    return cloudSyncQueue;
  }

  async function initializeCloudSync() {
    try {
      var cloud = await getCloudState();
      if (!validCloudState(cloud)) throw new Error("Unexpected Google Sheet data format.");
      if (Object.keys(cloud).length) {
        // Cloud is the shared copy across browsers; load it before allowing edits.
        state = cloud;
        save();
        var keys = Object.keys(state).sort();
        if (keys.length) $("month").value = keys[keys.length - 1];
        $("date").value = defaultDate();
        render();
      } else if (Object.keys(state).length) {
        // First sync: preserve this browser's existing records in the empty sheet.
        await autoSyncToCloud();
      }
      cloudSyncReady = true;
    } catch (err) {
      console.warn("Google Sheets is not connected yet; local storage remains active.", err);
    }
  }

  // ---- events ----
  $("month").addEventListener("change", function () {
    save();
    $("date").value = defaultDate();
    render();
  });
  $("income").addEventListener("input", function () {
    current().income = parseFloat(this.value) || 0;
    save(); analyze(current());
    if (cloudSyncReady) autoSyncToCloud();
  });
  $("addBtn").addEventListener("click", function () {
    var amt = parseFloat($("amount").value);
    if (!amt || amt <= 0) { $("amount").focus(); return; }
    var cat = $("cat").value;
    var key = monthKey();
    var date = $("date").value || defaultDate();
    if (date.slice(0, 7) !== key) {
      alert("That date is outside " + key + ". Entries must fall inside the selected month.");
      $("date").focus();
      return;
    }
    var m = current();
    // merge only same category on the same day — keeps the daily sheet tidy
    var found = null;
    for (var i = 0; i < m.expenses.length; i++) {
      if (m.expenses[i].cat === cat && m.expenses[i].date === date) { found = m.expenses[i]; break; }
    }
    if (found) found.amt += amt;
    else m.expenses.push({ cat: cat, amt: amt, date: date });
    m.expenses.sort(function (a, b) { return (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0; });
    $("amount").value = "";
    $("amount").focus();
    save(); render();
    if (cloudSyncReady) autoSyncToCloud();
  });
  $("amount").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("addBtn").click();
  });
  $("clearBtn").addEventListener("click", function () {
    if (!confirm("Clear all data for " + monthKey() + "?")) return;
    state[monthKey()] = { income: 0, expenses: [] };
    save(); render();
    if (cloudSyncReady) autoSyncToCloud();
  });
  $("downloadCsvBtn").addEventListener("click", function () {
    exportAllDataCsv();
  });
  // ---- Google Sheets cloud backup ----
  // After deploying the companion Google Apps Script, paste its Web App URL here.
  var GOOGLE_SHEETS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwttVpOKsDHxpcvWVteXkrkAaLaYM2AQ5cA_JvkVRvyrGOAJgdjmqKnLVjX00Jd4soxzA/exec";

  function getCloudState() {
    return new Promise(function (resolve, reject) {
      if (!/^https:\/\/script\.google\.com\/macros\/s\//.test(GOOGLE_SHEETS_WEB_APP_URL)) {
        reject(new Error("Set GOOGLE_SHEETS_WEB_APP_URL in the HTML first."));
        return;
      }
      var callbackName = "mmcCloudCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
      var script = document.createElement("script");
      var finished = false;
      var timer = setTimeout(function () { finish(new Error("Google Sheets did not respond. Check the Web App URL and deployment access.")); }, 15000);
      function finish(err, value) {
        if (finished) return;
        finished = true; clearTimeout(timer);
        try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
        if (err) reject(err); else resolve(value);
      }
      window[callbackName] = function (payload) {
        if (!payload || payload.ok !== true) return finish(new Error(payload && payload.error ? payload.error : "Could not read Google Sheet."));
        finish(null, payload.state || {});
      };
      script.onerror = function () { finish(new Error("Could not connect to Google Sheets. Check the deployed Web App URL.")); };
      script.src = GOOGLE_SHEETS_WEB_APP_URL + (GOOGLE_SHEETS_WEB_APP_URL.indexOf("?") >= 0 ? "&" : "?") + "action=load&callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
      document.head.appendChild(script);
    });
  }

  function postCloudState(snapshot) {
    if (!/^https:\/\/script\.google\.com\/macros\/s\//.test(GOOGLE_SHEETS_WEB_APP_URL)) {
      return Promise.reject(new Error("Set GOOGLE_SHEETS_WEB_APP_URL in the HTML first."));
    }
    // Apps Script cross-origin POSTs use no-cors; the browser cannot expose the response body.
    return fetch(GOOGLE_SHEETS_WEB_APP_URL, {
      method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ state: snapshot })
    });
  }

  function validCloudState(value) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return false;
    return Object.keys(value).every(function (key) {
      return /^\d{4}-\d{2}$/.test(key) && value[key] && typeof value[key] === "object" &&
        Number.isFinite(Number(value[key].income)) && Array.isArray(value[key].expenses) &&
        value[key].expenses.every(function (e) { return e && Number.isFinite(Number(e.amt)) && Number(e.amt) >= 0; });
    });
  }



  // ---- init ----
  (function init() {
    var el = $("month");
    el.value = localMonth();
    var keys = Object.keys(state).sort();
    if (keys.length && (!state[el.value] || !state[el.value].expenses.length)) {
      el.value = keys.slice(-1)[0];
    }
    $("date").value = defaultDate();
    render();
    initializeCloudSync();
  })();
})();
</script>
</body>
</html>
